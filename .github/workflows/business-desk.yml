name: Business Desk quality
on:
  pull_request:
    paths: ['business-desk/**', '.github/workflows/business-desk.yml']
  push:
    branches: [main]
    paths: ['business-desk/**', '.github/workflows/business-desk.yml']
permissions:
  contents: read
concurrency:
  group: desk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  business-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: business-desk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v
      - run: python -m py_compile domain.py business.py server.py hosted.py admin.py
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: business-desk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: business-desk/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --check static/app.js && node --check static/sync.js && node --check static/workspace.js
      - run: python tests/run_browser.py
        env:
          DESK_AGENT_BROWSER: node_modules/.bin/agent-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: business-desk-browser-evidence
          path: business-desk/verification/
          retention-days: 7
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t business-desk:test business-desk
      - run: |
          docker run -d --name desk-test -p 127.0.0.1:8765:8080 -e DESK_PUBLIC_ORIGIN=https://desk.example.test -e DESK_SETUP_KEY=fictional-ci-setup-key-32-characters-only business-desk:test
          for attempt in $(seq 1 20); do
            if curl --fail --silent -H 'Host: desk.example.test' http://127.0.0.1:8765/api/health; then exit 0; fi
            sleep 1
          done
          docker logs desk-test
          exit 1
      - name: Validate reverse-proxy configuration
        run: |
          docker run --rm -e SITE_HOST=desk.example.test -v "$PWD/business-desk/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile
